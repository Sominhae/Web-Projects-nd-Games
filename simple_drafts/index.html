<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="style.css">
   <title>Registration Form</title>
</head>
<body>
    <div class="form-container">
        <h2>Contact Form</h2>
        <form action="">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="your name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="abc@gmail.com" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Input a password" required>
            <label for="Date of Birth">Date of Birth:</label>
            <input type="date" id="birthdate" name="birthdate" required>
            <label for="phone">Contact Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="017xxxxxxx" required>
            <label for="gender">Gender:</label>
            <select name="gender" id="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            <input type="radio" name="member"  id="member"><label for="">Regular</label>
            <input type="radio" name="member" id="member"><label for="Premium">Premium</label>
            <input type="checkbox"> <label for="newsletter">Subscribe to our newsletters</label>
            <input type="submit">

        </form>

    </div>
</body>
</html>
