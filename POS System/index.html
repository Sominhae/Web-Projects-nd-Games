<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IceCream POS System</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>Ice Cream POS System </h1>
    <div class="container">
        <div class="item">
            <img src="images/lemon.jpg" alt="Lemon Ice Cream" onclick="addPrice(20)">
            <p>Lemon Ice Cream</p>
            <p>Price: 20 Taka</p>
        </div>
        <div class="item">
            <img src="images/orange.jpg" alt="Orange Ice Cream" onclick="addPrice(30)">
            <p>Orange Ice Cream</p>
            <p>price: 30 Taka</p>
        </div>
    </div>

    <div class="total">
        Total Cost: <span id="total">0</span>Taka
    </div>
    <button onclick="confirmOrder()">Confirm</button>
    <div id="message"></div>
   <script src="script.js"></script> 
</body>
</html>
